<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avisos de Santa Cena 2027</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <main class="pagina">

        <header class="encabezado">

            <h1>Avisos</h1>

            <div class="linea"></div>

            <h2>Registro de Santa Cena</h2>

            <p class="subtitulo">
                Primer domingo de cada mes
            </p>

            <p class="descripcion">
                Registre el aviso correspondiente a la Santa Cena
                que se realizará durante el año 2027.
            </p>

        </header>

        <form class="formulario">

            <label class="titulo" for="nombre">
                Nombre completo
            </label>

            <input
                class="campo"
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escriba su nombre completo"
            >

            <label class="titulo" for="fecha">
                Fecha de Santa Cena
            </label>

            <select
                class="selector"
                id="fecha"
                name="fecha"
            >

                <option value="">
                    Seleccione la Santa Cena
                </option>

                <option value="2027-01-03">3 de enero de 2027</option>
                <option value="2027-02-07">7 de febrero de 2027</option>
                <option value="2027-03-07">7 de marzo de 2027</option>
                <option value="2027-04-04">4 de abril de 2027</option>
                <option value="2027-05-02">2 de mayo de 2027</option>
                <option value="2027-06-06">6 de junio de 2027</option>
                <option value="2027-07-04">4 de julio de 2027</option>
                <option value="2027-08-01">1 de agosto de 2027</option>
                <option value="2027-09-05">5 de septiembre de 2027</option>
                <option value="2027-10-03">3 de octubre de 2027</option>
                <option value="2027-11-07">7 de noviembre de 2027</option>
                <option value="2027-12-05">5 de diciembre de 2027</option>

            </select>

            <h3>Aviso</h3>

            <p class="ayuda">
                Seleccione uno o varios avisos.
            </p>

            <div class="opciones">

                <label class="opcion">
                    <input type="checkbox" name="aviso" value="trabajo">
                    <span>Trabajo</span>
                </label>

                <label class="opcion">
                    <input type="checkbox" name="aviso" value="enfermedad">
                    <span>Enfermedad</span>
                </label>

                <label class="opcion">
                    <input type="checkbox" name="aviso" value="estudio">
                    <span>Estudio</span>
                </label>

                <label class="opcion">
                    <input type="checkbox" name="aviso" value="otro">
                    <span>Otro</span>
                </label>

            </div>

            <button
                type="submit"
                class="boton"
            >
                Registrar aviso
            </button>

        </form>

        <footer class="pie">
            Registro correspondiente al año 2027
        </footer>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
